<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-3.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue:wght@400&family=Winky+Rough:wght@300&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#11161b}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1376px">
  <figure class="r-hero-backdrop region plate" data-region="hero-backdrop"><img src="../../../assets/plates/hero-backdrop.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-nav-brand region chrome" data-region="nav-brand"><!-- Gold circular compass emblem and PRITI TRAVELS HUB uppercase condensed brand wordmark --></div>
  <div class="r-nav-links region text" data-region="nav-links"><!-- Top navigation links: Home Destinations Packages Experiences Offers Contact --><p style="font-size:var(--r-nav-links-font);line-height:1.05;margin:0">nav-links</p></div>
  <div class="r-nav-search-btn region control" data-region="nav-search-btn"><!-- Magnifying glass search icon trigger button: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-search-btn); a control need not have button chrome --></div>
  <div class="r-nav-cta region control" data-region="nav-cta"><!-- Rounded sunset saffron pill CTA button labeled Plan My Trip: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-cta); a control need not have button chrome --></div>
  <div class="r-hero-hairline region chrome" data-region="hero-hairline"><!-- Thin vertical sunset saffron editorial hairline framing the left hero block --></div>
  <div class="r-hero-location region text" data-region="hero-location"><!-- Warm gold location label reading Rajasthan · India --><p style="font-size:var(--r-hero-location-font);line-height:1.05;margin:0">hero-location</p></div>
  <div class="r-hero-title region text" data-region="hero-title"><!-- Monumental tall condensed uppercase off-white headline reading UDAIPUR --><p style="font-size:var(--r-hero-title-font);font-family:var(--r-hero-title-family),sans-serif;font-weight:var(--r-hero-title-weight);line-height:1.05;margin:0">hero-title</p></div>
  <div class="r-hero-desc region text" data-region="hero-desc"><!-- Two-line editorial description: Marble palaces rising from mirror waters as twilight paints the Aravallis in warm gold. --><p style="font-size:var(--r-hero-desc-font);font-family:var(--r-hero-desc-family),sans-serif;font-weight:var(--r-hero-desc-weight);line-height:1.05;margin:0">hero-desc</p></div>
  <div class="r-hero-bookmark region control" data-region="hero-bookmark"><!-- Circular frosted glass bookmark icon button: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop hero-bookmark); a control need not have button chrome --></div>
  <div class="r-hero-discover-btn region control" data-region="hero-discover-btn"><!-- Outline pill CTA button reading Discover Location: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop hero-discover-btn); a control need not have button chrome --></div>
  <figure class="r-card-kerala-img region plate" data-region="card-kerala-img"><img src="../../../assets/plates/card-kerala-img.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-card-kerala-label region text" data-region="card-kerala-label"><!-- White destination label reading Kerala on bottom-left of first carousel card --><p style="font-size:var(--r-card-kerala-label-font);line-height:1.05;margin:0">card-kerala-label</p></div>
  <figure class="r-card-himachal-img region plate" data-region="card-himachal-img"><img src="../../../assets/plates/card-himachal-img.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-card-himachal-label region text" data-region="card-himachal-label"><!-- Two-line white destination label reading Himachal Pradesh on second carousel card --><p style="font-size:var(--r-card-himachal-label-font);line-height:1.05;margin:0">card-himachal-label</p></div>
  <figure class="r-card-goa-img region plate" data-region="card-goa-img"><img src="../../../assets/plates/card-goa-img.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-card-goa-label region text" data-region="card-goa-label"><!-- White destination label reading Goa on third carousel card --><p style="font-size:var(--r-card-goa-label-font);line-height:1.05;margin:0">card-goa-label</p></div>
  <figure class="r-card-ladakh-img region plate" data-region="card-ladakh-img"><img src="../../../assets/plates/card-ladakh-img.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-card-ladakh-label region text" data-region="card-ladakh-label"><!-- White destination label reading Ladakh on fourth carousel card --><p style="font-size:var(--r-card-ladakh-label-font);line-height:1.05;margin:0">card-ladakh-label</p></div>
  <div class="r-carousel-prev region control" data-region="carousel-prev"><!-- Circular frosted glass previous-slide arrow button: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop carousel-prev); a control need not have button chrome --></div>
  <div class="r-carousel-next region control" data-region="carousel-next"><!-- Circular frosted glass next-slide arrow button: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop carousel-next); a control need not have button chrome --></div>
  <div class="r-carousel-progress region chrome" data-region="carousel-progress"><!-- Thin horizontal carousel progress line with active sunset saffron segment --></div>
  <div class="r-carousel-counter region text" data-region="carousel-counter"><!-- Large condensed slide counter reading 01 / 09 --><p style="font-size:var(--r-carousel-counter-font);line-height:1.05;margin:0">carousel-counter</p></div>
  <div class="r-search-dock region control" data-region="search-dock"><!-- Dark frosted-glass Quick Search Bar container overlapping hero bottom and off-white band: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop search-dock); a control need not have button chrome --></div>
  <div class="r-search-fields region text" data-region="search-fields"><!-- Segmented search bar inputs labeled Destination, Dates, Travellers, and Budget --><p style="font-size:var(--r-search-fields-font);line-height:1.05;margin:0">search-fields</p></div>
  <div class="r-search-submit region control" data-region="search-submit"><!-- Rounded sunset saffron Find Trips submit button inside search bar: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop search-submit); a control need not have button chrome --></div>
</main>
</body>
</html>
